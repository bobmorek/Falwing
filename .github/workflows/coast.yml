name: Build coastline
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install shapely==2.0.6
      - run: mkdir -p data && python tools/build_coast.py
      - name: Commit
        run: |
          git config user.name "falwing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/coast.json
          git diff --cached --quiet && exit 0
          git commit -m "Build coastline from OSM [skip ci]"
          git pull --rebase -q origin main
          git push
